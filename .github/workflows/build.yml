name: Build Sacred Trees

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build common module
        run: ./gradlew :common:build

      - name: Build NeoForge module
        run: ./gradlew :neoforge:build

      - name: Build Fabric module
        run: ./gradlew :fabric:build

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: sacred_trees-neoforge
          path: neoforge/build/libs/*.jar

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v7
        with:
          name: sacred_trees-fabric
          path: fabric/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NeoForge JAR
        uses: actions/download-artifact@v8
        with:
          name: sacred_trees-neoforge

      - name: Download Fabric JAR
        uses: actions/download-artifact@v8
        with:
          name: sacred_trees-fabric

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.jar
          generate_release_notes: true
