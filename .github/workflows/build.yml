name: Build Sacred Trees

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build common module
        run: ./gradlew :common:build

      - name: Build NeoForge module
        run: ./gradlew :neoforge:build

      - name: Build Fabric module
        run: ./gradlew :fabric:build

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: sacred_trees-neoforge
          path: neoforge/build/libs/*.jar

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: sacred_trees-fabric
          path: fabric/build/libs/*.jar
