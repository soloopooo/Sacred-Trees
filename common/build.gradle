plugins {
    // Using Fabric Loom just for Minecraft dependency resolution
    // MC 26.1 is unobfuscated, so no remapping needed
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    // No split source sets - this is the shared library
    // No remapping needed - MC 26.1 is unobfuscated
}

dependencies {
    // Minecraft jar for compilation (unobfuscated in 26.1)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No fabric-loader or fabric-api - this is platform-agnostic
}

version = project.mod_version

// Set explicit artifact name
base {
    archivesName = "${mod_id}-common"
}
